name: CI

on:
  push:
    branches:
      - 'main'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: 'CI'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            konfigyr-frontend/package-lock.json
            konfigyr-identity/package-lock.json

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: konfigyr-frontend/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build
        env:
          CI: 'true'
        run: ./gradlew build

      - name: Test Reports
        uses: codecov/codecov-action@v7
        if: success() || failure()
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Test coverage reports
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  publish:
    name: Build and publish Docker images
    runs-on: ubuntu-24.04
    needs: build
    env:
      CI: 'true'
      NIGHTLY: 'true'
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      DOCKER_DEFAULT_PLATFORM: 'linux/amd64'
    steps:
      - name: Check architecture
        run: |
          echo "uname: $(uname -m)"
          docker version --format '{{.Server.Os}}/{{.Server.Arch}}'
          echo "DOCKER_DEFAULT_PLATFORM=${DOCKER_DEFAULT_PLATFORM:-unset}"

      - name: Pull amd64 Paketo buildpack
        run: |
          docker rmi -f docker.io/paketobuildpacks/builder-noble-java-tiny:latest || true
          docker pull --platform linux/amd64 docker.io/paketobuildpacks/builder-noble-java-tiny:latest

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: true

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            konfigyr-frontend/package-lock.json
            konfigyr-identity/package-lock.json

      - name: Publish
        run: ./gradlew bootBuildImage --publishImage --stacktrace --info --no-daemon
